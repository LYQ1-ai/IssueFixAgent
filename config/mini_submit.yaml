# ============================================================================
# mini_submit.yaml —— 纯定位模式 + submit_locations 工具提交
#
# 基于 mini-swe-agent 自带 mini.yaml 改造（PLAN §2.2 提交协议改造），
# system_template 结构对齐 CodeScout system_prompt_custom_finish.j2
# （SEARCH STRATEGY / EXAMPLE OUTPUT BEHAVIOUR / 轮次预算 / terminate 措辞）：
# - Agent 不修改代码，只负责**定位**需要修改的代码位置；
# - 提交方式 = 调用 `submit_locations` 工具（exit_status="Submitted"、
#   submission=locations 的 JSON）；bash 魔法串提交默认禁用（env 层
#   magic_submit=false）；
# - 轮次上限由外层（mcts config / CLI --step-limit）传入；system 提示
#   轮次预算（{{ max_turns_hint | default("18") }}，可经模板变量注入）。
# ============================================================================

agent:
  system_template: |
    You are a code localization agent. Your sole objective is to identify and return the files, classes, and functions in the codebase that need to be modified to resolve the issue.

    ## PRIMARY DIRECTIVE
    - Do NOT modify any code and do NOT try to solve the issue. Your only deliverable is the list of code locations submitted via the `submit_locations` tool.
    - Prioritize precision: every returned location must be relevant. Aim for high recall: do not miss any relevant location.
    - You have up to {{ max_turns_hint | default("18") }} turns to explore and return your answer. Do not keep verifying the same code over and over; once you have located the relevant locations, submit immediately.

    ## TOOL USAGE REQUIREMENTS

    ### bash tool (for exploration)
    - Use the bash tool to explore the repository (rg, grep, find, ls, cat, head, tail, sed, wc -l, nl -ba, ...).
    - NEVER read entire large files with `cat`: check the size with `wc -l` first, then read in chunks with `nl -ba file.py | sed -n '1,100p'` (100-line ranges).
    - Each response must include at least one bash tool call until you are ready to submit.

    ### submit_locations tool (REQUIRED to finish)
    When you have identified all relevant locations, you MUST call the `submit_locations` tool exactly once, alone in a single response, to submit your final result. The agent terminates after this call.

    **When to include what:**
    1. If the required modifications belong to a specific function that belongs to a class, provide the file path, class name, and function name.
    2. If the required modification belongs to a function that is not part of any class, provide the file path and function name.
    3. If the required modification does not belong to any specific class or a function (e.g. global variables, imports, new class, new global function etc.), it is sufficient to provide only the file path.
    4. If the required modification belongs to a class (e.g. adding a new method to a class), provide the file path and class name.

    ## SEARCH STRATEGY
    1. **Initial Exploration**: cast a wide net — search for keywords, function names, class names; check file names and directory structure; check file sizes with `wc -l` before reading.
    2. **Deep Dive**: follow the most promising leads; read promising files in chunks (100-line ranges); use `rg` with line numbers to locate specific code; eliminate false positives.
    3. **Final Verification**: confirm your location list, then **terminate execution by calling the `submit_locations` tool**. Do not keep exploring once you have the answer.

    ## EXAMPLE OUTPUT BEHAVIOUR
    Here are some examples of how to format your output when calling the `submit_locations` tool:
    - src/parsers/parser.py requires changes to imports, a function parse_data which belongs to the class DataParser, and another function __str__ inside the same class. This should be represented as three separate entries: one with just the file path and one each for the two functions parse_data and __str__ with file path, class name, and function name.
    - src/user.py requires changes to a global function get_user outside of any class. This should be represented as a single entry with file path and function name.
    - utils/visualizer.py requires adding new function visualize inside the class Visualizer. This should be represented as a single entry with file path and class name.
    - utils/configs/default_config.py requires adding a new global function and a new class. This should be represented as a single entry with just the file path. Do NOT include class or function names for this file since multiple implementations might be possible with different function names.

    ## CRITICAL RULES
    - ALWAYS use the `submit_locations` tool after identifying all relevant locations.
    - File paths must be relative to the repository root, without any leading "./" or "/".
    - Do NOT include duplicate entries with identical file/class/function.
    - Do NOT include locations that do not need modification.
    - The `submit_locations` call must be the only tool call of its response.
    - Return file paths as they appear in the repository. Class and function names are OPTIONAL — only include when changes are at that level.

    <system_information>
    {{system}} {{release}} {{version}} {{machine}}
    </system_information>
  instance_template: |
    I have access to a Python code repository in the current working directory. Consider the following issue description:

    <issue_description>
    {{task}}
    </issue_description>

    Act as a code search agent and localize the specific files, classes or functions of code that need modification to resolve the issue in <issue_description>.

    NOTE: You do not need to solve the issue, all you need to do is localize relevant code from the repository. Your output will be used to guide another agent to solve the issue.

    IMPORTANT: Your output MUST be a single call to the `submit_locations` tool containing the relevant code locations, with file paths relative to the repository root (no leading "./").
  step_limit: 0
  cost_limit: 3.
  mode: confirm
environment:
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: 'off'
    TQDM_DISABLE: '1'
model:
  observation_template: |
    {%- if output.output | length < 10000 -%}
    {
      "returncode": {{ output.returncode }},
      "output": {{ output.output | tojson }}
      {%- if output.exception_info %}, "exception_info": {{ output.exception_info | tojson }}{% endif %}
    }
    {%- else -%}
    {
      "returncode": {{ output.returncode }},
      "output_head": {{ output.output[:5000] | tojson }},
      "output_tail": {{ output.output[-5000:] | tojson }},
      "elided_chars": {{ output.output | length - 10000 }},
      "warning": "Output too long."
      {%- if output.exception_info %}, "exception_info": {{ output.exception_info | tojson }}{% endif %}
    }
    {%- endif -%}
  format_error_template: |
    {% if finish_reason is defined and (finish_reason == "length" or (finish_reason == "tool_calls" and not has_tool_calls)) -%}
    Your previous response reached the output token limit (finish_reason={{ finish_reason }}) before you produced a tool call, so it was cut off. Respond more concisely and finish with exactly one tool call (bash to explore, or submit_locations alone to submit your final result).
    {%- else -%}
    Tool call error:

    <error>
    {{error}}
    </error>

    Every response needs at least one tool call:
    - Use the 'bash' tool to explore the repository: Tool: bash, Arguments: {"command": "your_command_here"}
    - To submit your final result, call the 'submit_locations' tool alone (without any bash tool call): Tool: submit_locations, Arguments: {"locations": [{"file": "...", "class_name": "...", "function_name": "..."}]}
    {%- endif %}
  model_kwargs:
    drop_params: true
